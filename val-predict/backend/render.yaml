services:
  - type: web
    name: valpredict-backend
    env: docker
    region: ohio
    plan: free
    dockerCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PANDASCORE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
